name: Validate

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
      - name: Check PHP syntax
        run: |
          set -eu
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run skeleton contract
        run: bash tests/skeleton-contract.sh
