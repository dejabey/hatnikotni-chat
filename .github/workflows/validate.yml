name: Validate

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'release/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Check PHP syntax
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run skeleton contract
        run: bash tests/skeleton-contract.sh

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  build-release:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production ZIP
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/hatnikotni-chat
          cp hatnikotni-chat.php dist/hatnikotni-chat/
          cp uninstall.php dist/hatnikotni-chat/
          cp readme.txt dist/hatnikotni-chat/
          cp -R includes dist/hatnikotni-chat/
          cp -R assets dist/hatnikotni-chat/
          cd dist
          zip -qr hatnikotni-chat-0.1.0-rc1.zip hatnikotni-chat

      - name: Upload production ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hatnikotni-chat-0.1.0-rc1
          path: dist/hatnikotni-chat-0.1.0-rc1.zip
          if-no-files-found: error
