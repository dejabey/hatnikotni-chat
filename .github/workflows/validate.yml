name: Validate

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'release/**'
      - 'wordpress-org-compliance'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - name: Check PHP syntax
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check frontend JavaScript syntax
        run: node --check assets/js/hatnikotni-chat-privacy.js
      - name: Run skeleton contract
        run: bash tests/skeleton-contract.sh
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  package:
    name: Build production package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext tools
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Build clean WordPress plugin ZIP
        id: package
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/package
          VERSION="$(sed -n 's/^ \* Version: \([0-9][0-9A-Za-z.+-]*\)$/\1/p' hatnikotni-chat.php | head -n 1)"
          test -n "$VERSION"
          ZIP_PATH="dist/hatnikotni-chat-${VERSION}.zip"
          mkdir -p dist/package/hatnikotni-chat
          git archive --format=tar HEAD hatnikotni-chat.php uninstall.php readme.txt assets includes languages | tar -x -C dist/package/hatnikotni-chat
          msgfmt --check --check-format -o dist/package/hatnikotni-chat/languages/hatnikotni-chat-ms_MY.mo dist/package/hatnikotni-chat/languages/hatnikotni-chat-ms_MY.po
          (cd dist/package && zip -qr "../hatnikotni-chat-${VERSION}.zip" hatnikotni-chat)
          unzip -l "$ZIP_PATH"
          unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat/hatnikotni-chat.php'
          unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat/readme.txt'
          if unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat-0.1.8/hatnikotni-chat.php'; then
            echo "Version-specific plugin folder is forbidden" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: hatnikotni-chat-${{ steps.package.outputs.version }}
          path: dist/hatnikotni-chat-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error
