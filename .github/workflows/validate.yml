name: Validate

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'release/**'
      - 'wordpress-org-compliance'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer
      - name: Check PHP syntax
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Check frontend JavaScript syntax
        run: node --check assets/js/hatnikotni-chat-privacy.js
      - name: Run skeleton contract
        run: bash tests/skeleton-contract.sh
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  package:
    name: Build production package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gettext tools
        run: sudo apt-get update && sudo apt-get install --yes gettext
      - name: Build clean WordPress plugin ZIP
        id: package
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist/package
          VERSION="$(sed -n 's/^ \* Version: \([0-9][0-9A-Za-z.+-]*\)$/\1/p' hatnikotni-chat.php | head -n 1)"
          test -n "$VERSION"
          ZIP_PATH="dist/hatnikotni-chat-${VERSION}.zip"
          mkdir -p dist/package/hatnikotni-chat
          git archive --format=tar HEAD hatnikotni-chat.php uninstall.php readme.txt assets includes languages | tar -x -C dist/package/hatnikotni-chat
          msgfmt --check --check-format -o dist/package/hatnikotni-chat/languages/hatnikotni-chat-ms_MY.mo dist/package/hatnikotni-chat/languages/hatnikotni-chat-ms_MY.po
          (cd dist/package && zip -qr "../hatnikotni-chat-${VERSION}.zip" hatnikotni-chat)
          unzip -l "$ZIP_PATH"
          unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat/hatnikotni-chat.php'
          unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat/readme.txt'
          if unzip -Z1 "$ZIP_PATH" | grep -qx 'hatnikotni-chat-0.1.8/hatnikotni-chat.php'; then
            echo "Version-specific plugin folder is forbidden" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: hatnikotni-chat-${{ steps.package.outputs.version }}
          path: dist/hatnikotni-chat-${{ steps.package.outputs.version }}.zip
          if-no-files-found: error

  migration-integration:
    name: Migration integration tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hatnch_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1
      - name: Run migration integration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: hatnch_test
        run: php tests/migration-integration.php

  wordpress-migration-integration:
    name: WordPress migration lifecycle tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli
      - name: Wait for MySQL
        run: |
          for attempt in {1..30}; do
            if mysqladmin ping -h 127.0.0.1 -uroot -proot --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1
      - name: Install WP-CLI and WordPress 6.6
        run: |
          set -eu
          WP_PATH="$RUNNER_TEMP/wordpress"
          mkdir -p "$WP_PATH"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output "$RUNNER_TEMP/wp-cli.phar"
          php "$RUNNER_TEMP/wp-cli.phar" core download --path="$WP_PATH" --version=6.6 --skip-content
          php "$RUNNER_TEMP/wp-cli.phar" config create --path="$WP_PATH" --dbname=wordpress_test --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          mkdir -p "$WP_PATH/wp-content/plugins/hatnikotni-chat"
          cp -R hatnikotni-chat.php uninstall.php readme.txt assets includes languages tests "$WP_PATH/wp-content/plugins/hatnikotni-chat/"
          php "$RUNNER_TEMP/wp-cli.phar" core install --path="$WP_PATH" --url=http://localhost --title="Hatnikotni CI" --admin_user=ci-admin --admin_password=ci-password --admin_email=ci@example.invalid --skip-email
          php "$RUNNER_TEMP/wp-cli.phar" --path="$WP_PATH" plugin activate hatnikotni-chat
          echo "WP_PATH=$WP_PATH" >> "$GITHUB_ENV"
          echo "WP_CLI=$RUNNER_TEMP/wp-cli.phar" >> "$GITHUB_ENV"
      - name: Run WordPress-backed migration lifecycle tests
        run: php "$WP_CLI" --path="$WP_PATH" eval-file "$WP_PATH/wp-content/plugins/hatnikotni-chat/tests/wordpress-migration-integration.php"
