name: Validate

on:
  push:
    branches:
      - main
      - 'dev/**'
      - 'feature/**'
      - 'release/**'
      - 'wordpress-org-compliance'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: Check PHP syntax
        run: |
          set -eu
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Run skeleton contract
        run: bash tests/skeleton-contract.sh

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  package:
    name: Build production package
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build clean WordPress plugin ZIP
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          git archive --format=zip --prefix=hatnikotni-chat/ HEAD \
            hatnikotni-chat.php \
            uninstall.php \
            readme.txt \
            assets \
            includes \
            -o dist/hatnikotni-chat-0.1.1.zip
          unzip -l dist/hatnikotni-chat-0.1.1.zip

      - name: Upload production package
        uses: actions/upload-artifact@v4
        with:
          name: hatnikotni-chat-0.1.1
          path: dist/hatnikotni-chat-0.1.1.zip
          if-no-files-found: error
